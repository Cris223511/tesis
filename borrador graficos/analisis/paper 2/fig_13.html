<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figura 13 - Distribución de Confianza CNN</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 30px;
        }

        .legend-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f7fafc;
            border-radius: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 12px;
        }

        .legend-text {
            font-size: 13px;
            color: #2d3748;
        }

        .legend-value {
            font-weight: bold;
            margin-left: auto;
            color: #4a5568;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Figura 13. Distribución de confianza del modelo CNN (N=1,500 inferencias)</h2>
        <div class="chart-container">
            <canvas id="confidenceChart"></canvas>
        </div>
        <div class="legend-container">
            <div class="legend-item">
                <div class="legend-color" style="background: #FF6384;"></div>
                <div class="legend-text">90.0% - 92.99%</div>
                <div class="legend-value">12.47%</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #36A2EB;"></div>
                <div class="legend-text">93.0% - 95.99%</div>
                <div class="legend-value">28.20%</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFCE56;"></div>
                <div class="legend-text">96.0% - 98.99%</div>
                <div class="legend-value">49.87%</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #4BC0C0;"></div>
                <div class="legend-text">99.0% - 100.0%</div>
                <div class="legend-value">9.46%</div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('confidenceChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: [
                    '90.0% - 92.99% (Moderadamente alta)',
                    '93.0% - 95.99% (Alta)',
                    '96.0% - 98.99% (Muy alta)',
                    '99.0% - 100.0% (Excepcional)'
                ],
                datasets: [{
                    data: [12.47, 28.20, 49.87, 9.46],
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.8)',
                        'rgba(54, 162, 235, 0.8)',
                        'rgba(255, 206, 86, 0.8)',
                        'rgba(75, 192, 192, 0.8)'
                    ],
                    borderColor: [
                        'rgba(255, 99, 132, 1)',
                        'rgba(54, 162, 235, 1)',
                        'rgba(255, 206, 86, 1)',
                        'rgba(75, 192, 192, 1)'
                    ],
                    borderWidth: 3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    title: {
                        display: true,
                        text: 'Accuracy Promedio General: 96.01%',
                        font: { size: 18, weight: 'bold' },
                        color: '#2d3748',
                        padding: { bottom: 20 }
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                let label = context.label || '';
                                let value = context.parsed;
                                let count = 0;

                                if (context.dataIndex === 0) count = 187;
                                if (context.dataIndex === 1) count = 423;
                                if (context.dataIndex === 2) count = 748;
                                if (context.dataIndex === 3) count = 142;

                                return [
                                    label,
                                    value.toFixed(2) + '% del total',
                                    count + ' inferencias'
                                ];
                            }
                        }
                    }
                },
                cutout: '65%'
            }
        });
    </script>
</body>

</html>
